plugins {
    id 'com.android.library'
}

apply from: '../config.gradle'

android {
    namespace 'com.qingzhu.sdk'
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        minSdk rootProject.ext.android.minSdk
        targetSdk rootProject.ext.android.targetSdk
        versionCode 1
        versionName "0.1.0"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 开源门面：api 暴露新内核与开源协议，使用方直接可见 QDevice/QTask/QCommand 等类型。
    // 不做白标隐藏（开源无需隐藏内部类型），使用方可直接引用内核类型。
    api project(':qingzhu-core')
    // 两个开源示例协议：Eddystone（标准 beacon，Service Data 0xFEAA）
    // 与 Generic（自定义透传，Service Data 0xFFE0），识别条件互斥，可同时注册
    api project(':qingzhu-protocol-eddystone')
    api project(':qingzhu-protocol-generic')
}
